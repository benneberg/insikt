name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        # Note: If you set up Trusted Publishing, you don't even need the NODE_AUTH_TOKEN env var!
        # If you are using a classic token, keep this line:
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
